<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Bisma ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(#ffd6e7,#fff);
text-align:center;
overflow-x:hidden;
}

.box{
margin:40px auto;
padding:25px;
width:85%;
max-width:400px;
background:white;
border-radius:25px;
box-shadow:0 0 20px pink;
}

img{
width:180px;
border-radius:20px;
}

h1{
color:#ff4081;
}

p{
font-size:18px;
color:#555;
}

button{
background:#ff4081;
color:white;
border:none;
padding:14px 25px;
border-radius:30px;
font-size:18px;
margin:10px;
}

.heart{
position:fixed;
font-size:30px;
animation:fall 5s linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10vh);
}
100%{
transform:translateY(110vh);
}
}

.hidden{
display:none;
}

</style>
</head>

<body>

<div class="box" id="start">

<img src="bubu1.jpg">

<h1>Happy Birthday Bisma ❤️</h1>

<p>Ali has a little surprise for you 🎁</p>

<button onclick="startSurprise()">
Start Surprise 💖
</button>

</div>

 <div class="heart">❤️</div>
 
<div class="heart">💖</div>
 
<div class="heart">💕</div>

<div class="box hidden" id="story">

<h1>💖 For My Special Person Bisma ❤️</h1>

<img id="bubuPic" src="bubu2.jpg">

<p id="message">
🤭 Ek choti si surprise story sirf tumhare liye...
</p>

<button onclick="nextStory()">
Next ❤️
</button>

</div>


<div class="box hidden" id="videoBox">

<h1>🎥 A Little Memory ❤️</h1>

<video width="100%" controls>
<source src="video1.mp4" type="video/mp4">
</video>

<br>

<button onclick="nextStory()">
Continue 💖
</button>

</div>


<audio id="music" loop>
<source src="palpal.mp3" type="audio/mpeg">
</audio>


<script>

let step=0;

let pics=[
"bubu1.jpg",
"bubu2.jpg",
"bubu3.jpg",
"bubu4.jpg",
"bubu5.jpg",
"bubu6.jpg"
];

let messages=[
"🌸 Tumhari smile meri favourite cheez hai ❤️",
"😂 Tumhari hasi hamesha aisi hi rahe",
"🤗 Kabhi udaas hona to yaad rakhna koi tumhari khushi ki dua karta hai",
"💖 Tum meri zindagi ki bohot special wajah ho",
"🤲 Allah tumhe hamesha khush rakhe aur tumhara doctor banne ka sapna poora kare",
"❤️ Aur promise... hamesha aise hi rehna"
];


function startSurprise(){

document.getElementById("start").style.display="none";

document.getElementById("story").style.display="block";

document.getElementById("music").play();

}


function nextStory(){

step++;

if(step < pics.length){

document.getElementById("bubuPic").src=pics[step];

document.getElementById("message").innerHTML=messages[step];

}

else{

document.getElementById("story").style.display="none";

document.getElementById("videoBox").style.display="block";

}

}

</script>

</body>
</html>
