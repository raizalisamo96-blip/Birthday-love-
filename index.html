<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Bisma ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Loading Screen -->
<div id="loading-screen">
    <h1>🎂 Happy Birthday Bisma ❤️</h1>
    <p>Ek choti si surprise sirf tumhare liye...</p>
    <button id="startBtn">Start Surprise 💖</button>
</div>

<!-- Cake Scene -->
<div id="cake-scene" class="hidden">

    <h1>🎂 Happy Birthday 🎂</h1>

    <div id="countdown">3</div>

    <div class="cake">
        <div class="candle">
            <div class="flame"></div>
        </div>
    </div>

    <button id="blowBtn">💨 Blow Candle</button>

</div>

<!-- Main Surprise -->
<div id="main" class="hidden">

    <div id="hearts"></div>

    <div id="flowers"></div>

    <h1>❤️ Welcome Bisma ❤️</h1>

    <img id="bubu" src="bubu1.jpg">

    <img id="photo" src="photo1.jpg">

    <p id="text"></p>

    <button id="nextBtn">Next ❤️</button>

</div>

<script src="script.js"></script>

</body>
  </html>
