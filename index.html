<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Bisma ❤️</title>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.box{
background:white;
padding:30px;
border-radius:30px;
box-shadow:0 0 25px pink;
width:80%;
max-width:350px;
}

h1{
color:#ff4f8b;
}

.bubu{
font-size:60px;
animation:jump 1s infinite alternate;
}

@keyframes jump{
from{transform:translateY(0);}
to{transform:translateY(-15px);}
}

.heart{
position:absolute;
font-size:25px;
animation:fall 5s linear infinite;
}

@keyframes fall{
from{
top:-10%;
}
to{
top:110%;
}
}

button{
background:#ff4f8b;
color:white;
border:none;
padding:15px 30px;
border-radius:30px;
font-size:18px;
}

</style>
</head>

<body>

<div class="box">

<div class="bubu">🧸🧸</div>

<h1>Happy Birthday Bisma ❤️</h1>

<p>
Bubu & Dudu have a surprise for you 🎁
</p>

<button>
Start Surprise 💖
</button>

</div>


<div class="heart">❤️</div>
<div class="heart">💖</div>
<div class="heart">💕</div>

</body>
</html>
