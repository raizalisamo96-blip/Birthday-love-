<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Bisma ❤️</title>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.box{
background:white;
padding:30px;
border-radius:30px;
box-shadow:0 0 25px pink;
width:80%;
max-width:350px;
}

h1{
color:#ff4f8b;
}

.bubu{
font-size:60px;
animation:jump 1s infinite alternate;
}

@keyframes jump{
from{transform:translateY(0);}
to{transform:translateY(-15px);}
}

.heart{
position:absolute;
font-size:25px;
animation:fall 5s linear infinite;
}

@keyframes fall{
from{
top:-10%;
}
to{
top:110%;
}
}

button{
background:#ff4f8b;
color:white;
border:none;
padding:15px 30px;
border-radius:30px;
font-size:18px;
}

</style>
</head>

<body>

<div class="box">

<div class="bubu">🧸🧸</div>

<h1>Happy Birthday Bisma ❤️</h1>

<p>
Ali has a surprise for you 🎁
</p>

<button>
Start Surprise 💖
</button>

</div>


<div class="heart">❤️</div>
<div class="heart">💖</div>
<div class="heart">💕</div>

<div id="questionBox">
<h2 id="question">🤭 Kya tum mujhe roz thoda sa tang karne dogi?</h2>

<button onclick="nextQuestion()">Yes ❤️</button>
<button id="noBtn" onclick="moveNo()">No 😂</button>
</div>

<div id="surprise">
<h1>🎁 Birthday Surprise ❤️</h1>

<p>
Bisma ❤️ tumhare liye ek special surprise hai 🧸✨
</p>

<h2>💌 Forever Yours, Ali</h2>
</div>

<script>

let questions = [
"🤭 Kya tum mujhe roz thoda sa tang karne dogi?",
"😂 Kya tum meri boring jokes bhi smile ke saath sunogi?",
"🧸 Kya tum mujhe hamesha apna Bubu bulaane dogi?",
"🥹 Kya tum meri khushi ka reason banti rahogi?",
"🌸 Kya tum hamari pyari memories ko sambhal kar rakhogi?",
"😎 Kya tum maanogi ke Ali thoda sa pagal hai?",
"❤️ Kya tum phir bhi Ali ko pasand karogi?",
"🧸 Kya Bubu & Dudu ki team hamesha saath rahegi?",
"😂 Kya tum meri masti ka jawab masti se dogi?",
"🎁 Kya tum Ali ke surprise ke liye ready ho?",
  "🥰 Kya tum meri smile ki wajah banti rahogi?",
"😜 Kya tum Ali ki thodi si pagalpan wali baatein bardasht karogi?",
"🌹 Kya tum hamari har cute memory yaad rakhogi?",
"💖 Kya tum mujhe dekh kar smile karogi?",
"🧸 Kya Bubu & Dudu hamesha saath rahenge?",
"😂 Kya tum meri masti ko enjoy karogi?",
"✨ Kya tum hamari story ko special banaogi?",
"🎀 Kya tum is surprise ko poora dekhogi?",
"💌 Kya tum Ali ka special message padhogi?",
"🎂 Kya tum final birthday surprise ke liye ready ho?"
];

let current = 0;

function nextQuestion(){
current++;

if(current < questions.length){
document.getElementById("question").innerHTML = questions[current];
else{
document.getElementById("question").innerHTML="🎂 Happy Birthday Bisma ❤️";
document.getElementById("surprise").style.display="block";

  {
function moveNo(){
let btn=document.getElementById("noBtn");
btn.style.position="absolute";
btn.style.left=Math.random()*80+"%";
btn.style.top=Math.random()*80+"%";
}

</script>
</body>
</html>
